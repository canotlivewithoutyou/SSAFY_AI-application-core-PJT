<!doctype html>
<!-- 7단계 — 화면에서 API 부르기
     서버: uvicorn app.main:app --reload         (터미널 1)
     화면: python -m http.server 5500            (터미널 2)  →  http://localhost:5500
     /docs 에서 계획을 두어 건 저장한 뒤 이 화면을 새로고침하면 목록이 보인다 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Movie Planner</title>
  </head>
  <body>
    <h1>관람 계획</h1>
    <ul id="list"></ul>
    <script>
      async function loadPlans() {
        const res = await fetch("http://localhost:8000/api/plans");
        const plans = await res.json();
        document.querySelector("#list").innerHTML = plans
          .map(
            (p) =>
              `<li>${p.watch_date} ${p.start_time ?? ""} ${p.movie_nm}</li>`,
          )
          .join("");
      }
      loadPlans();
    </script>
  </body>
</html>
